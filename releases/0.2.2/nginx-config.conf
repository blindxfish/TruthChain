# TruthChain Mainnet Nginx Configuration
# Optional: Use this if you want to add SSL/HTTPS support

server {
    listen 80;
    server_name 168.231.108.135;
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;
    
    # For now, proxy to HTTP
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for mesh network
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
    
    # Status endpoint
    location /status {
        proxy_pass http://127.0.0.1:8080/status;
    }
    
    # Network stats
    location /network/stats {
        proxy_pass http://127.0.0.1:8080/network/stats;
    }
    
    # Wallet info (consider restricting access)
    location /wallet {
        proxy_pass http://127.0.0.1:8080/wallet;
        # Add IP restrictions for security
        # allow 127.0.0.1;
        # deny all;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Rate limiting (optional)
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location / {
    #     limit_req zone=api burst=20 nodelay;
    #     proxy_pass http://127.0.0.1:8080;
    # }
}

